# A tag like v0.1.1 (or v0.1.1-test) builds the signed APK and publishes it as a GitHub release, so riders can
# sideload it (OpenPelo, adb, or the tablet's browser) and Gregario's screen shows "New version available".
# Needs four repository secrets: GREGARIO_KEYSTORE (the .jks, base64), GREGARIO_STORE_PASSWORD,
# GREGARIO_KEY_ALIAS, GREGARIO_KEY_PASSWORD. The same key must sign every release, or updates won't install.
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.GREGARIO_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.GREGARIO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GREGARIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GREGARIO_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::GREGARIO_KEYSTORE secret missing (see the top of this file)"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/gregario.jks"
          {
            echo "storeFile=$RUNNER_TEMP/gregario.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Tests and APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Check the version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"; tag="${tag%%-*}"
          name=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          if [ "$tag" != "$name" ]; then echo "::error::Tag $GITHUB_REF_NAME but versionName $name"; exit 1; fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          cp "$apk" "Gregario-${GITHUB_REF_NAME}.apk"
          cp "$apk" Gregario.apk
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" "Gregario-${GITHUB_REF_NAME}.apk" Gregario.apk $pre \
            --title "Gregario ${GITHUB_REF_NAME}" --notes-file docs/release-notes.md
